openapi: 3.1.0
info:
  title: calliope API
  version: '1.0'
  summary: Multi-tenant headless content API
  license:
    name: UNLICENSED
  description: >
    All write routes require a cerberus-issued Bearer token with the
    `content:write` scope. Read routes marked "optional auth" are public,
    but upgrade to the management view (all statuses, full records,
    tenancy enforced) when a valid Bearer token is presented. List
    endpoints return a `{data, meta}` envelope; single-resource routes
    return the bare resource. Errors are always `{code, message}`
    (plus optional `meta`). See docs/API.md for the full narrative.
servers:
  - url: http://localhost:3002
    description: local dev
tags:
  - name: health
  - name: blogs
  - name: authors
  - name: categories
  - name: tags
  - name: articles
paths:
  /v1/health:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /v1/blogs:
    post:
      tags: [blogs]
      summary: Create a blog in the caller's organization
      operationId: createBlog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    Explicit slug; collisions are 409. Omitted →
                    generated from name with numeric suffixing.
      responses:
        '201': { $ref: '#/components/responses/Blog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [blogs]
      summary: List the caller's blogs
      operationId: listBlogs
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Envelope of blogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/blogs/{blogId}:
    get:
      tags: [blogs]
      summary: Fetch one blog (must belong to the caller's org)
      operationId: getBlog
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
      responses:
        '200': { $ref: '#/components/responses/Blog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/authors:
    post:
      tags: [authors]
      summary: Create an author
      operationId: createAuthor
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                bio: { type: ['string', 'null'], maxLength: 5000 }
                avatarUrl: { type: ['string', 'null'], format: uri }
      responses:
        '201': { $ref: '#/components/responses/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [authors]
      summary: List authors (optional auth — public items are whitelisted)
      operationId: listAuthors
      security: []
      description: >-
        Anonymous: whitelist projection (id, name, bio, avatarUrl).
        Bearer token presented: tenancy enforced, full rows.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Envelope of authors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/authors/{authorId}:
    patch:
      tags: [authors]
      summary: Update an author (explicit null clears bio/avatarUrl)
      operationId: updateAuthor
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/AuthorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                bio: { type: ['string', 'null'], maxLength: 5000 }
                avatarUrl: { type: ['string', 'null'], format: uri }
      responses:
        '200': { $ref: '#/components/responses/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [authors]
      summary: Delete an author (409 while articles reference it)
      operationId: deleteAuthor
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/AuthorId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/blogs/{blogId}/categories:
    post:
      tags: [categories]
      summary: Create a category
      operationId: createCategory
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { type: string, minLength: 1, maxLength: 200 }
                description: { type: ['string', 'null'], maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [categories]
      summary: List categories (optional auth — public items are whitelisted)
      operationId: listCategories
      security: []
      description: >-
        Anonymous: whitelist projection (id, name, slug, description).
        Bearer token presented: tenancy enforced, full rows.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Envelope of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/categories/{categoryId}:
    patch:
      tags: [categories]
      summary: Update a category (explicit null clears description)
      operationId: updateCategory
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/CategoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { type: string, minLength: 1, maxLength: 200 }
                description: { type: ['string', 'null'], maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [categories]
      summary: Delete a category (409 while articles reference it)
      operationId: deleteCategory
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/CategoryId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/blogs/{blogId}/tags:
    post:
      tags: [tags]
      summary: Create a tag
      operationId: createTag
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [tags]
      summary: List tags (optional auth — public items are whitelisted)
      operationId: listTags
      security: []
      description: >-
        Anonymous: whitelist projection (id, name, slug). Bearer token
        presented: tenancy enforced, full rows.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Envelope of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/tags/{tagId}:
    patch:
      tags: [tags]
      summary: Update a tag
      operationId: updateTag
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/TagId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tags]
      summary: Delete a tag
      operationId: deleteTag
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/TagId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/articles:
    post:
      tags: [articles]
      summary: Create an article (idempotent)
      operationId: createArticle
      description: >-
        Idempotency: a client-supplied `id` (UUID) is used verbatim with
        upsert-on-conflict semantics, and/or an `Idempotency-Key` header
        is stored for 24h. Replays return the existing article with 200;
        fresh creates return 201.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Client idempotency key (24h replay window).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, authorId]
              properties:
                id:
                  type: string
                  format: uuid
                  description: Optional client-supplied id (idempotency).
                title: { type: string, minLength: 1, maxLength: 300 }
                slug: { type: string, minLength: 1, maxLength: 200 }
                excerpt: { type: ['string', 'null'], maxLength: 1000 }
                content: { $ref: '#/components/schemas/Content' }
                coverImageUrl: { type: ['string', 'null'], format: uri }
                authorId: { type: string, format: uuid }
                categoryId: { type: ['string', 'null'], format: uuid }
                tagIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 50
                status: { $ref: '#/components/schemas/ArticleStatus' }
                relatedArticleIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 10
      responses:
        '201': { $ref: '#/components/responses/Article' }
        '200': { $ref: '#/components/responses/Article' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [articles]
      summary: List articles (optional auth — public is published-only)
      operationId: listArticles
      security: []
      description: >-
        Anonymous: published articles only, public projection. Bearer
        token presented: all statuses, full management rows (content
        omitted). `q` is a case-insensitive contains search on
        title/excerpt with ILIKE metacharacters escaped.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: status
          in: query
          required: false
          description: Management-only filter (ignored for anonymous).
          schema: { $ref: '#/components/schemas/ArticleStatus' }
        - name: authorId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: tagId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Envelope of articles
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ArticleListEnvelope'
                  - $ref: '#/components/schemas/PublicArticleListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/articles/{articleId}/related:
    get:
      tags: [articles]
      summary: Curated related set expanded to full articles
      operationId: getRelatedArticles
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/ArticleId' }
      responses:
        '200':
          description: Full articles in curated order (dangling ids skipped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/blogs/{blogId}/articles/{articleId}:
    get:
      tags: [articles]
      summary: Fetch one article by id (management) or slug (public)
      operationId: getArticle
      security: []
      description: >-
        GET accepts an id OR a slug in this slot. UUID param + token →
        management record (any status). UUID param, no token → 404 (ids
        are not public). Non-UUID param → public slug lookup,
        published-only, public projection; a UUID-shaped slug falls back
        to the public lookup when no id matches. `?include=related`
        expands the curated related set inline.
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/ArticleId' }
        - name: include
          in: query
          required: false
          schema: { type: string, enum: [related] }
      responses:
        '200':
          description: Article (management or public projection)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Article'
                  - $ref: '#/components/schemas/PublicArticle'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [articles]
      summary: Update an article (nullable clearing, optimistic locking)
      operationId: updateArticle
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/ArticleId' }
        - name: If-Match
          in: header
          required: false
          schema: { type: string, pattern: '^\d+$' }
          description: >-
            Expected version for optimistic locking; mismatch → 409.
            The `version` body field is an alternative carrier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                slug: { type: string, minLength: 1, maxLength: 200 }
                excerpt: { type: ['string', 'null'], maxLength: 1000 }
                content: { $ref: '#/components/schemas/Content' }
                coverImageUrl: { type: ['string', 'null'], format: uri }
                authorId: { type: string, format: uuid }
                categoryId: { type: ['string', 'null'], format: uuid }
                tagIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 50
                status: { $ref: '#/components/schemas/ArticleStatus' }
                relatedArticleIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 10
                version:
                  type: integer
                  minimum: 0
                  description: Optimistic-lock expectation.
      responses:
        '200': { $ref: '#/components/responses/Article' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [articles]
      summary: Delete an article
      operationId: deleteArticle
      parameters:
        - { $ref: '#/components/parameters/BlogId' }
        - { $ref: '#/components/parameters/ArticleId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: cerberus-issued RS256 token; write routes need the content:write scope.
  parameters:
    BlogId:
      name: blogId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthorId:
      name: authorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: article.not_found }
        message: { type: string }
        meta: { type: object, additionalProperties: true }
    ListMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ArticleStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    Content:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        required: [type, data]
        properties:
          type: { type: string, minLength: 1, maxLength: 200 }
          data:
            type: object
            additionalProperties: true
            description: At most 100 keys per block.
    Blog:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Author:
      type: object
      properties:
        id: { type: string, format: uuid }
        blogId: { type: string, format: uuid }
        name: { type: string }
        bio: { type: ['string', 'null'] }
        avatarUrl: { type: ['string', 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicAuthorItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bio: { type: ['string', 'null'] }
        avatarUrl: { type: ['string', 'null'], format: uri }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        blogId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: ['string', 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicCategoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: ['string', 'null'] }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        blogId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicTagItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    TaxonomyRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    Article:
      type: object
      properties:
        id: { type: string, format: uuid }
        blogId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        categoryId: { type: ['string', 'null'], format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: ['string', 'null'] }
        content: { $ref: '#/components/schemas/Content' }
        coverImageUrl: { type: ['string', 'null'], format: uri }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        publishedAt: { type: ['string', 'null'], format: date-time }
        relatedArticleIds:
          type: array
          items: { type: string, format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/Author' }
        category: { $ref: '#/components/schemas/Category' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    PublicArticle:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: ['string', 'null'] }
        content: { $ref: '#/components/schemas/Content' }
        coverImageUrl: { type: ['string', 'null'], format: uri }
        publishedAt: { type: ['string', 'null'], format: date-time }
        author: { $ref: '#/components/schemas/PublicAuthorItem' }
        category: { $ref: '#/components/schemas/TaxonomyRef' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TaxonomyRef' }
        related:
          type: array
          items: { $ref: '#/components/schemas/PublicArticle' }
    BlogListEnvelope:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Blog' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    AuthorListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Author'
              - $ref: '#/components/schemas/PublicAuthorItem'
        meta: { $ref: '#/components/schemas/ListMeta' }
    CategoryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Category'
              - $ref: '#/components/schemas/PublicCategoryItem'
        meta: { $ref: '#/components/schemas/ListMeta' }
    TagListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Tag'
              - $ref: '#/components/schemas/PublicTagItem'
        meta: { $ref: '#/components/schemas/ListMeta' }
    ArticleListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Article' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    PublicArticleListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicArticle' }
        meta: { $ref: '#/components/schemas/ListMeta' }
  responses:
    NoContent:
      description: Deleted (empty body)
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 'Missing/invalid token or insufficient scope (WWW-Authenticate: Bearer)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Cross-tenant access (`*.forbidden`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (`*.not_found`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (`*.conflict` — slug collision, archived-is-terminal, FK in use, stale version)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Blog:
      description: Blog
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Blog' }
    Author:
      description: Author
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Author' }
    Category:
      description: Category
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Category' }
    Tag:
      description: Tag
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tag' }
    Article:
      description: Article (full management shape)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Article' }
security:
  - bearerAuth: []
